 d+=`<line x1="30" y1="232" x2="330" y2="232" stroke="#9C9483" stroke-width="1.1" stroke-dasharray="5 4"/>`;
 d+=`<text x="326" y="224" text-anchor="end" font-size="11" fill="#6E685B">${esc(p.label||'协方差 = 0')}</text>`;
 d+=`<text x="196" y="270" font-size="11" fill="#6E685B">${esc(p.note||'但明显不独立')}</text>`;
 return d;},
gcurves:(p={})=>{let d='';
 const box=(x0,kind,lab)=>{let s=`<line x1="${x0}" y1="238" x2="${x0+104}" y2="238" stroke="#9C9483" stroke-width="1.2"/><line x1="${x0}" y1="238" x2="${x0}" y2="118" stroke="#9C9483" stroke-width="1.2"/>`;
  let pts=[];
  if(kind==='sq'){for(let i=0;i<=32;i++){const x=-1+2*i/32;const y=x*x;pts.push((x0+52+x*46).toFixed(1)+','+(178-y*56).toFixed(1));}}
  if(kind==='fw'){for(let i=0;i<=32;i++){const x=-1+2*i/32;const y=Math.abs(x);pts.push((x0+52+x*46).toFixed(1)+','+(178-y*56).toFixed(1));}}
  if(kind==='hw'){for(let i=0;i<=32;i++){const x=-1+2*i/32;const y=Math.max(x,0);pts.push((x0+52+x*46).toFixed(1)+','+(178-y*56).toFixed(1));}}
  s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${AC}" stroke-width="2"/>`;
  s+=`<text x="${x0+52}" y="262" text-anchor="middle" font-size="12" fill="#6E685B">${esc(lab)}</text>`;
  return s;};
 d+=box(18,'平方律','sq')+box(130,'全波','fw')+box(242,'半波','hw');
 return d;},
halfwave:(p={})=>{let d=`<line x1="24" y1="262" x2="336" y2="262" stroke="#9C9483" stroke-width="1.4"/><line x1="24" y1="262" x2="24" y2="26" stroke="#9C9483" stroke-width="1.4"/>`;
 if(p.mode==='chi2'){let pts=[];
  for(let i=1;i<=40;i++){const x=2+i*(310/40);const y=256-176*Math.exp(-x/70)/(1+x/16);pts.push(x.toFixed(1)+','+y.toFixed(1));}
  d+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${AC}" stroke-width="2.2"/>`;
  d+=`<text x="220" y="120" font-size="12" fill="#6E685B">${esc(p.label||'y=0 处发散')}</text>`;}
 else{d+=`<rect x="58" y="96" width="9" height="166" fill="${AC}"/>`;
  d+=`<text x="72" y="120" font-size="12" fill="#6E685B">½ 概率</text>`;
  let pts=[];
  for(let i=0;i<=36;i++){const x=64+i*(268/36);const y=262-118*Math.exp(-Math.pow((x-190)/78,2));pts.push(x.toFixed(1)+','+y.toFixed(1));}
  d+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${AC}" stroke-width="2"/>`;
  d+=`<text x="290" y="150" text-anchor="end" font-size="12" fill="#6E685B">${esc(p.label||'右半边正态')}</text>`;}
 d+=`<text x="330" y="284" text-anchor="end" font-size="11" fill="#9A9384">${esc(p.axis||'w')}</text>`;return d;},
custom:(p={})=>p.svg||''
};
function svgWrap(inner){return `<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg"><defs>
<marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="${AC}"/></marker>
<marker id="ar2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9C9483"/></marker>
</defs>${inner}</svg>`}

function splitChars(el){
  const s=el.textContent;el.textContent='';
  for(const ch of s){const sp=document.createElement('span');sp.className='ch';
    sp.textContent=ch===' '?'\u00a0':ch;el.appendChild(sp)}
}
function applyP(el,p){
  if(p<=0){el.style.visibility='hidden';return}
  el.style.visibility='visible';
  const wipe=el.querySelector('.wipe')||el;
  if(el.dataset.math==='1'){
    if(p>=1){wipe.style.webkitMaskImage='none';wipe.style.maskImage='none';wipe.style.clipPath='none'}
    else{const e=Math.min(100,p*100), f=Math.max(0,e-10);
      const g=`linear-gradient(to right,#000 ${f}%,rgba(0,0,0,0) ${e}%)`;
      wipe.style.webkitMaskImage=g;wipe.style.maskImage=g;wipe.style.clipPath='none'}
    wipe.style.opacity=1;
  }else{
    const cs=el.querySelectorAll('.ch'),n=Math.round(p*cs.length);
    cs.forEach((c,i)=>c.classList.toggle('on',i<n));
  }
  el.style.transform=`translateY(${(1-p)*5}px)`;
  el.style.opacity=1;
}
function doLayout(){
  const flow=document.getElementById('flow');
  let total=0;const items=[...flow.children];
  items.forEach(it=>total+=it.offsetHeight+parseFloat(getComputedStyle(it).marginBottom||0));
  if(total>440){const k=Math.max(.82,440/total);
    items.forEach(it=>{it.style.fontSize=(parseFloat(getComputedStyle(it).fontSize)*k)+'px';
      it.style.marginBottom=(parseFloat(getComputedStyle(it).marginBottom)*k)+'px'});
    total=0;items.forEach(it=>total+=it.offsetHeight+parseFloat(getComputedStyle(it).marginBottom||0));
  }
  const avail=448;
  const probTail=flow.querySelector('.beat.problem.plast');
  if(probTail){
    const extra=Math.min(30,Math.max(0,avail-total));
    probTail.style.marginBottom=(parseFloat(getComputedStyle(probTail).marginBottom||0)+extra)+'px';
  }else if(total<avail&&items.length>1){
    const extra=Math.min(14,(avail-total)/(items.length-1));
    items.forEach(it=>it.style.marginBottom=(parseFloat(getComputedStyle(it).marginBottom||0)+extra)+'px');
  }
  const maxW=flow.clientWidth;
  flow.querySelectorAll('.main .wipe,.formula .wipe').forEach(w=>{
    let fs=parseFloat(getComputedStyle(w.parentElement).fontSize),g=0;
    while(w.scrollWidth>maxW&&fs>22&&g<24){fs-=2;w.parentElement.style.fontSize=fs+'px';g++;}
  });
}

window.setScene=async function(scene){
  SCENE=scene;BEATS=scene.beats||[];AC=scene.accent||'#2F5D8A';TINT=scene.tint||'#E8EFF6';
  document.documentElement.style.setProperty('--accent',AC);
  document.documentElement.style.setProperty('--tint',TINT);
  document.body.className=scene.layout==='pause'?'pause':'';
  document.getElementById('modpill').textContent=scene.moduleLabel||'';
  document.getElementById('pageid').textContent=scene.page||'';
  document.getElementById('ref').textContent='材料 '+ (scene.ref||'') +' · '+((META.course)||'');
  const flow=document.getElementById('flow');flow.innerHTML='';
  const dg=document.getElementById('diagram');dg.innerHTML='';
  const asEl=document.getElementById('aside');asEl.dataset.filled='';
  asEl.querySelector('.body').innerHTML='';document.body.classList.remove('asideon');
  asEl.querySelector('.t').textContent='备忘';
  document.body.classList.toggle('aslayout', (scene.beats||[]).some(b=>b.kind==='aside'));
  const tt=document.getElementById('titleText');tt.innerHTML='';tt.style.clipPath='inset(0 100% 0 0)';
  const ul0=document.querySelector('#title .ul');if(ul0)ul0.style.opacity=0;
  const isPause=scene.layout==='pause';
  if(isPause){
    document.getElementById('pauseMain').textContent=
      scene.pauseText||META.pause_text||'请暂停，自己先算一遍';
    document.getElementById('pauseSub').textContent=
      scene.pauseSub || ('按暂停自己算 · '+Math.round(scene.duration||3)+' 秒后继续');
  }
  tt.innerHTML=esc(scene.title||'');
  const hasDg=!!(scene.diagram&&DIAG[scene.diagram]);
  document.body.classList.toggle('wide',!hasDg);
  dg.style.display=hasDg?'block':'none';
  if(hasDg){dg.innerHTML=svgWrap(DIAG[scene.diagram](scene.diagramParams||{}))}
  BEATS.forEach((b,i)=>{
    if(b.kind==='diagram'||b.kind==='title'||b.kind==='aside')return;
    const el=document.createElement('div');
    el.className='beat '+b.kind;el.dataset.i=i;
    if(b.kind==='chip'){
      el.dataset.math='1';
      el.innerHTML=`<span class="wipe">${esc(b.html)}</span>`;
    }else{
      el.dataset.math=isMath(b.html)?'1':'0';
      if(b.kind==='step'){const n=document.createElement('span');n.className='num';n.textContent=b.n||'';el.appendChild(n)}
      const wrap=document.createElement('div');wrap.className='wipe';
      const inner=document.createElement('span');inner.className='txt';inner.innerHTML=esc(b.html);
      wrap.appendChild(inner);el.appendChild(wrap);
      if(b.kind==='main'&&!isMath(b.html)&&b.html.length>10)el.classList.add('small');
    }
    flow.appendChild(el);
  });
  const chips=[...flow.querySelectorAll('.beat.chip')];
  if(chips.length){const row=document.createElement('div');row.className='chips';
    flow.insertBefore(row,chips[0]);chips.forEach(c=>row.appendChild(c))}
  await MathJax.typesetPromise([tt,flow]);
  flow.querySelectorAll('.beat').forEach(el=>{
    if(el.dataset.math==='0'){const t=el.querySelector('.txt');if(t)splitChars(t)}
  });
  const pbs=[...flow.querySelectorAll('.beat.problem')];
  if(pbs.length){pbs[0].classList.add('pfirst');pbs[pbs.length-1].classList.add('plast')}
  doLayout();
  flow.querySelectorAll('.beat').forEach(el=>applyP(el,0));
  dg.style.visibility='hidden';
  if(isPause){
    tt.style.clipPath='none';tt.style.opacity=1;
    const ulp=document.querySelector('#title .ul');if(ulp)ulp.style.opacity=1;
    flow.querySelectorAll('.beat').forEach(el=>applyP(el,1));
    flow.querySelectorAll('.beat.chip').forEach(el=>el.classList.add('on'));
    document.querySelectorAll('#diagram .jval').forEach(g=>g.setAttribute('opacity',1));
    if(hasDg){dg.style.visibility='visible';dg.style.clipPath='none';dg.style.opacity=1}
    document.getElementById('pauseMask').style.opacity=0;
    document.getElementById('pauseText').style.opacity=0;
  }
  // 内容少时向下沉一点、在标题与页脚之间居中，避免下半屏大片空白；
  // 内容多（超过可用高度）就维持顶部对齐，不硬挤。
  {const availH=392, baseTop=190;
   const hh=flow.scrollHeight||0;
   flow.style.top=(baseTop+Math.max(0,Math.min(96,(availH-hh)/2)))+'px';}
  window.SCENE_READY=true;
};

window.seek=function(t){
  if(!SCENE)return'';
  if(SCENE.layout==='pause'){
    const p=Math.min(1,Math.max(0,(t-.15)/.5));
    document.getElementById('pauseMask').style.opacity=p;
    const pt=document.getElementById('pauseText');
    pt.style.opacity=p;pt.style.transform=`translate(-50%,${(1-p)*10}px)`;
    return 'p'+Math.round(p*24);
  }
  const first=BEATS.find(b=>b.kind==='title')||BEATS[0];
  const tp=first?Math.min(1,Math.max(0,(t-first.start)/first.rise)):1;
  const tt=document.getElementById('titleText');
  tt.style.clipPath=tp>=1?'none':`inset(0 ${(1-tp)*100}% 0 0)`;
  tt.style.opacity=tp>=1?1:.4+.6*tp;
  const ul=document.querySelector('#title .ul');if(ul)ul.style.opacity=Math.min(1,tp*2.2);
  const sig=[Math.round(tp*30)];let active=0;
  BEATS.forEach((b,i)=>{
    if(b.kind==='aside'){
      const box=document.getElementById('aside');
      const p=Math.min(1,Math.max(0,(t-b.start)/b.rise));
      if(p>0&&box.dataset.filled!=='1'){
        const raw=b.html||'';
        const hd=raw.match(/<!--hd:(.+?)-->/);
        if(hd)box.querySelector('.t').textContent=hd[1];
        box.querySelector('.body').innerHTML=raw.replace(/<!--hd:.+?-->/,'');
        box.dataset.filled='1';
        if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([box]);
      }
      document.body.classList.toggle('asideon',p>0);
      sig.push(Math.round(p*30));if(p>0&&p<1)active++;
      return;
    }
    if(b.kind==='diagram'){
      const el=document.getElementById('diagram');
      const p=Math.min(1,Math.max(0,(t-b.start)/b.rise));
      el.style.visibility=p>0?'visible':'hidden';
      el.style.clipPath=p>=1?'none':`inset(-6% ${(1-p)*100}% -6% 0)`;
      el.style.opacity=p>=1?1:.15+.85*p;
      sig.push(Math.round(p*36));if(p>0&&p<1)active++;
      return;
    }
    const el=document.getElementById('flow').querySelector(`.beat[data-i="${i}"]`);
    if(!el)return;
    const p=Math.min(1,Math.max(0,(t-b.start)/b.rise));
    if(b.kind==='chip')el.classList.toggle('on',p>=1);
    applyP(el,p);sig.push(Math.round(p*36));if(p>0&&p<1)active++;
  });
  if(SCENE.diagram2){
    const p2=Math.min(1,Math.max(0,(t-SCENE.diagram2)/0.7));
    document.querySelectorAll('#diagram .jval').forEach(g=>{g.setAttribute('opacity',p2);g.style.transition='none'});
    sig.push(Math.round(p2*24)); if(p2>0&&p2<1) active++;
  }
  sig.push(active);
  return sig.join(',');
};
MathJax.startup.promise.then(()=>{window.READY=true});
</script>
