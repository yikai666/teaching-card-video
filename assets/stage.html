<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>notebook-video stage</title>
<style>
:root{--paper:#F7F3E8;--ink:#24221C;--muted:#6E685B;--line:#D9D2C0;--accent:#2F5D8A;--tint:#E8EFF6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;
  background-image:linear-gradient(to right,rgba(90,80,60,.055) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(90,80,60,.045) 1px,transparent 1px);
  background-size:40px 40px}
#stage{position:relative;width:1280px;height:720px;overflow:hidden}
#stage:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
.topbar{position:absolute;left:64px;right:64px;top:28px;display:flex;justify-content:space-between;align-items:center}
.chapter{font-size:12.5px;letter-spacing:.16em;color:var(--muted)}
.chapter b{color:var(--ink);font-weight:600;letter-spacing:.06em}
.pill{font-size:12px;letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent);
  background:var(--tint);padding:6px 13px;border-radius:999px}
.rule{position:absolute;left:64px;right:64px;top:56px;height:1px;background:var(--line)}
#title{position:absolute;left:64px;top:82px;width:1150px;font-family:"Noto Serif CJK SC","Noto Serif SC",serif;
  font-size:39px;line-height:1.3;font-weight:700}
#titleText{display:block;white-space:nowrap;overflow:hidden}
#title .ul{position:absolute;left:0;bottom:-9px;height:4px;width:54px;background:var(--accent);border-radius:2px}
#flow{position:absolute;left:64px;top:190px;width:716px}
body.wide #flow{width:1148px}
.beat{margin:0 0 22px 0}
.beat .wipe{display:inline-block;max-width:100%;position:relative}
.beat.def .wipe{max-width:100%}
.beat.note{font-size:25px;line-height:1.62;color:#3B372D;padding-left:26px}
.beat.note:before{content:"";position:absolute;left:0;top:12px;width:9px;height:9px;border-radius:2px;background:var(--accent);opacity:.85}
.beat.main{font-size:46px;line-height:1.35;font-family:"Noto Serif CJK SC","Noto Serif SC",serif}
.beat.main.small{font-size:37px}
.beat.step{font-size:25px;line-height:1.55;padding-left:46px;color:#332F27;margin-bottom:16px}
.beat.step .num{position:absolute;left:0;top:1px;width:29px;height:29px;border-radius:50%;
  border:1.5px solid var(--accent);color:var(--accent);font-family:"Noto Serif CJK SC",serif;
  font-size:14px;display:flex;align-items:center;justify-content:center;background:var(--tint)}
.beat.problem{font-size:25px;line-height:1.58;color:#2B2620;background:var(--tint);
  border-left:4px solid var(--accent);padding:9px 22px;margin:0}
.beat.problem.pfirst{padding-top:15px;border-radius:0 10px 0 0;margin-top:2px}
.beat.problem .wipe{display:block;max-width:100%}
.beat.problem.plast{padding-bottom:16px;border-radius:0 0 10px 0;margin-bottom:20px}
/* knowledge blocks: definition / symbol note */
.beat.def{position:relative;font-size:23px;line-height:1.55;background:var(--tint);
  border-left:4px solid var(--accent);padding:9px 20px 10px 72px;border-radius:0 8px 8px 0;
  color:#2B2620;margin-bottom:14px}
.beat.def .tag{position:absolute;left:18px;top:13px;font-size:11.5px;letter-spacing:.14em;
  color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 7px}
/* 知识点块：正式定义 / 定理 / 结论，比 def 更轻 */
.beat.kp{position:relative;font-size:23px;line-height:1.56;background:#FCF8EC;
  border:1px solid var(--line);border-radius:9px;padding:10px 18px 11px 78px;
  color:#2B2620;margin-bottom:14px}
.beat.kp .tag{position:absolute;left:16px;top:14px;font-size:11px;letter-spacing:.12em;
  color:var(--accent);background:var(--tint);border-radius:4px;padding:2px 7px}
.beat.sym{font-size:19px;line-height:1.5;color:#6E685B;padding-left:46px;position:relative;margin-bottom:12px}
.beat.sym:before{content:"符号";position:absolute;left:0;top:2px;font-size:10.5px;letter-spacing:.1em;
  color:#9A9384;border:1px solid var(--line);border-radius:3px;padding:1px 4px}
#stemBar{position:absolute;left:64px;right:64px;top:178px;display:none;
  font-size:17px;line-height:1.55;color:#3B372D;background:var(--tint);
  border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 18px 9px}
#stemBar .tag{display:inline-block;font-size:11px;letter-spacing:.14em;color:var(--accent);
  border:1px solid var(--accent);border-radius:4px;padding:1px 6px;margin-right:9px;vertical-align:2px}
body.havestem #stemBar{display:block}
body.havestem #flow{top:264px}
body.havestem #diagram{top:244px;height:330px}
.beat.banner{font-size:29px;line-height:1.45;font-family:"Noto Serif CJK SC",serif;
  border-left:5px solid var(--accent);background:var(--tint);padding:13px 20px;border-radius:0 10px 10px 0}
.beat.formula{font-size:32px;line-height:1.45;padding:10px 0}
.beat.chip{display:inline-block;font-size:19px;padding:9px 16px;border:1.5px solid var(--line);
  border-radius:9px;color:var(--muted);margin:0 10px 0 0}
.beat.chip.on{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.chips{display:flex;gap:0;flex-wrap:wrap;margin-bottom:22px}
#diagram{position:absolute;right:56px;top:172px;width:410px;height:392px}
#diagram svg{width:100%;height:100%;display:block}
/* 高数备忘框：右下角，一次只放一条工具公式 */
#aside{position:absolute;right:56px;bottom:118px;width:374px;display:none;
  background:rgba(250,247,238,.96);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:6px;padding:8px 16px 11px;box-shadow:0 4px 16px rgba(40,34,24,.07)}
body.hasaside #aside{display:block}
body.hasaside #diagram{height:318px}
#aside .ah{font-size:10.5px;letter-spacing:.16em;color:var(--accent);margin-bottom:4px}
#aside .af{font-size:19px;line-height:1.5;color:#24221C;font-family:"Noto Serif CJK SC",serif}
#aside .an{font-size:12.5px;line-height:1.5;color:#6E685B;margin-top:3px}
/* 公式 / 符号速查小卡：右上角，跟随本页正文自动出现 */
#gloss{position:absolute;right:64px;top:78px;width:auto;min-width:238px;max-width:364px;display:none;
  background:rgba(251,248,239,.95);border:1px solid var(--line);border-radius:10px;
  padding:8px 13px 9px;box-shadow:0 2px 10px rgba(40,34,24,.045)}
body.hasgloss #gloss{display:block}
#gloss .gh{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;
  color:#9A9384;margin-bottom:4px}
#gloss .gh:after{content:"";flex:1;height:1px;background:var(--line)}
#gloss .grow{display:flex;align-items:baseline;gap:9px;line-height:1.42;margin-top:2px}
#gloss .gk{flex:0 0 auto;white-space:nowrap;font-size:14.5px;color:var(--accent);
  font-family:"Noto Serif CJK SC",serif}
#gloss .gv{flex:1;min-width:0;font-size:12.5px;color:#5C5647}
/* 例题卡：左侧题目常驻，右侧解答 */
#exPanel{position:absolute;left:64px;top:78px;width:428px;max-height:648px;min-height:250px;display:none;
  flex-direction:column;background:rgba(252,249,241,.94);border:1px solid var(--line);
  border-top:3px solid var(--accent);border-radius:10px;padding:15px 19px 13px;
  box-shadow:0 4px 18px rgba(40,34,24,.05)}
body.example #exPanel{display:flex}
body.example #title{display:none}
body.example #flow{left:536px;top:86px;width:680px;height:560px;
  display:flex;flex-direction:column;justify-content:center}
body.example .beat{margin-bottom:19px}
body.example .beat.main{font-size:31px;line-height:1.55}
body.example .beat.main.small{font-size:27px}
body.example .beat.step,body.example .beat.note{font-size:21px;line-height:1.62}
body.example .beat.def,body.example .beat.kp{font-size:20px;line-height:1.55}
body.example .beat.banner{font-size:24px}
.beat.fig{margin:2px 0 18px}
.beat.fig svg{display:block;width:100%;height:auto}
.exh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exno{flex:0 0 auto;font-size:12.5px;letter-spacing:.08em;color:#fff;background:var(--accent);
  border-radius:5px;padding:3px 9px;font-family:"Noto Serif CJK SC",serif}
.ext{font-size:18.5px;line-height:1.35;font-family:"Noto Serif CJK SC",serif;font-weight:600}
#exStem{font-size:17px;line-height:1.75;color:#332F27;flex:0 0 auto;overflow:hidden}
#exStem>div{margin-bottom:4px}
#exStem .mjx-container{font-size:105%!important}
.exused{margin-top:14px;border-top:1px dashed var(--line);padding-top:8px;flex:0 0 auto}
.exused .uh{font-size:10.5px;letter-spacing:.16em;color:var(--accent);margin-bottom:5px}
.exused .ui{position:relative;font-size:12.4px;line-height:1.52;color:#5C5647;padding-left:13px;margin-bottom:3px}
.exused .ui:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;
  background:var(--accent);opacity:.7}
#footer{position:absolute;left:64px;right:64px;bottom:20px;display:flex;justify-content:space-between;
  font-size:11.5px;letter-spacing:.10em;color:#9A9384;border-top:1px solid var(--line);padding-top:9px}
#footer .id{font-family:ui-monospace,Menlo,monospace}
.mjx-container{color:inherit!important}
.ch{opacity:0}
.ch.on{opacity:1}
/* pause card: keep the previous page on screen, fade it slightly, put a hint bar at the bottom */
.pause #stage:before{opacity:.45}
#pauseMask{position:absolute;inset:0;display:none;z-index:20;background:rgba(247,243,232,.40)}
.pause #pauseMask{display:block}
#pauseText{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);
  display:none;z-index:21;flex-direction:column;align-items:center;gap:5px;white-space:nowrap;
  background:#FBF8EF;border:1.5px solid var(--accent);border-radius:13px;
  padding:11px 30px 12px;box-shadow:0 8px 26px rgba(40,34,24,.16);
  color:var(--ink);font-family:"Noto Serif CJK SC",serif;font-size:28px;letter-spacing:.05em}
#pauseText small{font-family:"Noto Sans CJK SC",sans-serif;font-size:12.5px;font-weight:400;
  letter-spacing:.14em;color:var(--muted)}
.pause #pauseText{display:flex}
</style>

<body>
<div id="stage">

const isMath=s=>String(s||'').indexOf('\\(')>=0||String(s||'').indexOf('$$')>=0;

window.setMeta=function(m){
  META=m||{};
  document.title=META.name||'notebook-video';
  document.getElementById('chapter').innerHTML=esc(META.course||'')+' · <b>'+esc(META.chapter||'')+'</b>';
  document.getElementById('pauseMain').textContent=META.pause_text||'请暂停，自己先算一遍';
  document.getElementById('ref').textContent=(META.course||'')+' · '+(META.chapter||'');
};

function splitChars(el){
  const s=el.textContent;el.textContent='';
  for(const ch of s){const sp=document.createElement('span');sp.className='ch';
    sp.textContent=ch===' '?'\u00a0':ch;el.appendChild(sp)}
}
function applyP(el,p){
  if(p<=0){el.style.visibility='hidden';return}
  el.style.visibility='visible';
  const wipe=el.querySelector('.wipe')||el;
  if(el.dataset.math==='1'){
    if(p>=1){wipe.style.webkitMaskImage='none';wipe.style.maskImage='none';wipe.style.clipPath='none'}
    else{const e=Math.min(100,p*100), f=Math.max(0,e-10);
      const g=`linear-gradient(to right,#000 ${f}%,rgba(0,0,0,0) ${e}%)`;
      wipe.style.webkitMaskImage=g;wipe.style.maskImage=g;wipe.style.clipPath='none'}
    wipe.style.opacity=1;
  }else{
    const cs=el.querySelectorAll('.ch'),n=Math.round(p*cs.length);
    cs.forEach((c,i)=>c.classList.toggle('on',i<n));
  }
  el.style.transform=`translateY(${(1-p)*5}px)`;
  el.style.opacity=1;
}
function doLayout(){
  const flow=document.getElementById('flow');
  const avail=document.body.classList.contains('example')?540:(document.body.classList.contains('havestem')?366:448);
  let total=0;const items=[...flow.children];
  items.forEach(it=>total+=it.offsetHeight+parseFloat(getComputedStyle(it).marginBottom||0));
  if(total>avail){const k=Math.max(.80,avail/total);
    items.forEach(it=>{it.style.fontSize=(parseFloat(getComputedStyle(it).fontSize)*k)+'px';
      it.style.marginBottom=(parseFloat(getComputedStyle(it).marginBottom)*k)+'px'});
    total=0;items.forEach(it=>total+=it.offsetHeight+parseFloat(getComputedStyle(it).marginBottom||0));
  }
  const probTail=flow.querySelector('.beat.problem.plast');
  if(probTail){
    const extra=Math.min(30,Math.max(0,avail-total));
    probTail.style.marginBottom=(parseFloat(getComputedStyle(probTail).marginBottom||0)+extra)+'px';
  }else if(total<avail&&items.length>1){
    const extra=Math.min(14,(avail-total)/(items.length-1));
    items.forEach(it=>it.style.marginBottom=(parseFloat(getComputedStyle(it).marginBottom||0)+extra)+'px');
  }
  const maxW=flow.clientWidth;
  flow.querySelectorAll('.main .wipe,.formula .wipe').forEach(w=>{
    let fs=parseFloat(getComputedStyle(w.parentElement).fontSize),g=0;
    while(w.scrollWidth>maxW&&fs>22&&g<24){fs-=2;w.parentElement.style.fontSize=fs+'px';g++;}
  });
}

window.setScene=async function(scene){
  SCENE=scene;BEATS=scene.beats||[];AC=scene.accent||'#2F5D8A';TINT=scene.tint||'#E8EFF6';
  document.documentElement.style.setProperty('--accent',AC);
  document.documentElement.style.setProperty('--tint',TINT);
  const isEx=scene.layout==='example';
  document.body.className=isEx?'example':(scene.layout==='pause'?'pause':'');
  document.getElementById('modpill').textContent=scene.moduleLabel||'';
  document.getElementById('pageid').textContent=scene.page||'';
  document.getElementById('ref').textContent='材料 '+ (scene.ref||'') +' · '+((META.course)||'');
  const flow=document.getElementById('flow');flow.innerHTML='';
  const dg=document.getElementById('diagram');dg.innerHTML='';
  const tt=document.getElementById('titleText');tt.innerHTML='';tt.style.clipPath='inset(0 100% 0 0)';
  const ul0=document.querySelector('#title .ul');if(ul0)ul0.style.opacity=0;
  const isPause=scene.layout==='pause';
  document.getElementById('exno').textContent=isEx?(scene.exNo||''):'';
  document.getElementById('ext').textContent=isEx?(scene.exTitle||''):'';
  const exStem=document.getElementById('exStem');
  exStem.innerHTML=isEx?String(scene.stem||'').split('\n').map(l=>`<div>${esc(l)}</div>`).join(''):'';
  document.getElementById('exUsed').innerHTML=isEx?(scene.used||[]).map(u=>`<div class="ui">${esc(u)}</div>`).join(''):'';
  exStem.style.fontSize='15.8px';
  if(isPause){
    document.getElementById('pauseMain').textContent=
      scene.pauseText||META.pause_text||'请暂停，自己先算一遍';
    document.getElementById('pauseSub').textContent=
      '按暂停自己算 · '+Math.round(scene.duration||3)+' 秒后继续';
  }
  tt.innerHTML=esc(scene.title||'');
  const gl=isPause?[]:(scene.gloss||[]);
  const gb=document.getElementById('glossBody');
  gb.innerHTML=gl.map(g=>`<div class="grow"><span class="gk">\\(${g.sym}\\)</span>`
    +`<span class="gv">${esc(g.note||'')}</span></div>`).join('');
  let gTw=0;
  if(gl.length){const rg=document.createRange();rg.selectNodeContents(tt);
    gTw=rg.getBoundingClientRect().width||0}
  const gConflict=gl.length>0&&(gTw+64>772);
  document.body.classList.toggle('hasgloss',gl.length>0&&!gConflict&&!isEx);
  const ab=BEATS.find(b=>b.kind==='aside');
  let aHtml='',aNote='';
  if(ab){const s0=String(ab.html),c0=s0.indexOf('｜');
    aHtml=c0>0?s0.slice(0,c0):s0; aNote=c0>0?s0.slice(c0+1):'';
    document.getElementById('asideF').innerHTML=esc(aHtml);
    document.getElementById('asideN').innerHTML=esc(aNote);
    document.getElementById('asideN').style.display=aNote?'block':'none';
  }
  document.body.classList.toggle('hasaside',!!ab&&!isEx);
  if(!ab){document.getElementById('asideF').innerHTML='';document.getElementById('asideN').innerHTML=''}
  const hasDg=!!(scene.diagram&&DIAG[scene.diagram]);
  document.body.classList.toggle('wide',!hasDg&&!isEx);
  document.body.classList.toggle('havestem',!!scene.stemBar);
  document.getElementById('stemText').innerHTML=scene.stemBar?esc(scene.stemBar):'';
  dg.style.display=hasDg?'block':'none';
  if(hasDg){dg.innerHTML=svgWrap(DIAG[scene.diagram](scene.diagramParams||{}))}
  BEATS.forEach((b,i)=>{
    if(b.kind==='diagram'||b.kind==='title'||b.kind==='aside')return;
    const el=document.createElement('div');
    el.className='beat '+b.kind;el.dataset.i=i;
    if(b.kind==='fig'){
      el.dataset.math='0';
      el.innerHTML=b.html;
      flow.appendChild(el);
      return;
    }
    if(b.kind==='chip'){
      el.dataset.math='1';
      el.innerHTML=`<span class="wipe">${esc(b.html)}</span>`;
    }else if(b.kind==='def'||b.kind==='kp'){
      const s0=String(b.html),cut=s0.indexOf('｜');
      const tag=cut>0?s0.slice(0,cut):(b.kind==='kp'?'知识点':'定义'),body=cut>0?s0.slice(cut+1):s0;
      el.dataset.math=isMath(body)?'1':'0';
      const tg=document.createElement('span');tg.className='tag';tg.textContent=tag;
      const wrap=document.createElement('div');wrap.className='wipe';
      const inner=document.createElement('span');inner.className='txt';inner.innerHTML=esc(body);
      wrap.appendChild(inner);el.appendChild(tg);el.appendChild(wrap);
    }else{
      let html=b.html;
      if(b.kind==='sym'){const i0=String(html).indexOf('｜');if(i0>0)html=String(html).slice(i0+1)}
      el.dataset.math=isMath(html)?'1':'0';
      if(b.kind==='step'){const n=document.createElement('span');n.className='num';n.textContent=b.n||'';el.appendChild(n)}
      const wrap=document.createElement('div');wrap.className='wipe';
      const inner=document.createElement('span');inner.className='txt';inner.innerHTML=esc(html);
      wrap.appendChild(inner);el.appendChild(wrap);
      if(b.kind==='main'&&!isMath(b.html)&&b.html.length>10)el.classList.add('small');
    }
    flow.appendChild(el);
  });
  const chips=[...flow.querySelectorAll('.beat.chip')];
  if(chips.length){const row=document.createElement('div');row.className='chips';
    flow.insertBefore(row,chips[0]);chips.forEach(c=>row.appendChild(c))}
  await MathJax.typesetPromise([tt,flow,document.getElementById('stemText'),document.getElementById('gloss'),document.getElementById('aside'),exStem,document.getElementById('exUsed')]);
  if(isEx){
    const avail=648-15-13-document.querySelector('.exh').offsetHeight
      -document.querySelector('.exused').offsetHeight-30;
    let fs=17;exStem.style.fontSize=fs+'px';
    while(exStem.scrollHeight>avail&&fs>11.2){fs-=.4;exStem.style.fontSize=fs.toFixed(1)+'px'}
  }
  flow.querySelectorAll('.beat').forEach(el=>{
    if(el.dataset.math==='0'){const t=el.querySelector('.txt');if(t)splitChars(t)}
  });
  const pbs=[...flow.querySelectorAll('.beat.problem')];
  if(pbs.length){pbs[0].classList.add('pfirst');pbs[pbs.length-1].classList.add('plast')}
  doLayout();
  flow.querySelectorAll('.beat').forEach(el=>applyP(el,0));
  dg.style.visibility='hidden';
  if(isPause){
    tt.style.clipPath='none';tt.style.opacity=1;
    const ulp=document.querySelector('#title .ul');if(ulp)ulp.style.opacity=1;
    flow.querySelectorAll('.beat').forEach(el=>applyP(el,1));
    flow.querySelectorAll('.beat.chip').forEach(el=>el.classList.add('on'));
    document.querySelectorAll('#diagram .jval').forEach(g=>g.setAttribute('opacity',1));
    if(hasDg){dg.style.visibility='visible';dg.style.clipPath='none';dg.style.opacity=1}
    document.getElementById('pauseMask').style.opacity=0;
    document.getElementById('pauseText').style.opacity=0;
  }
  window.SCENE_READY=true;
};

window.seek=function(t){
  if(!SCENE)return'';
  if(SCENE.layout==='pause'){
    const p=Math.min(1,Math.max(0,(t-.15)/.5));
    document.getElementById('pauseMask').style.opacity=p;
    const pt=document.getElementById('pauseText');
    pt.style.opacity=p;pt.style.transform=`translate(-50%,${(1-p)*10}px)`;
    return 'p'+Math.round(p*24);
  }
  if(SCENE.layout==='example'){
    BEATS.forEach((b,i)=>{
      const el=document.getElementById('flow').querySelector(`.beat[data-i="${i}"]`);
      if(!el)return;
      const p=Math.min(1,Math.max(0,(t-b.start)/b.rise));
      applyP(el,p);
    });
    return 'ex';
  }
  const first=BEATS.find(b=>b.kind==='title')||BEATS[0];
  const tp=first?Math.min(1,Math.max(0,(t-first.start)/first.rise)):1;
  const tt=document.getElementById('titleText');
  tt.style.clipPath=tp>=1?'none':`inset(0 ${(1-tp)*100}% 0 0)`;
  tt.style.opacity=tp>=1?1:.4+.6*tp;
  const ul=document.querySelector('#title .ul');if(ul)ul.style.opacity=Math.min(1,tp*2.2);
  const sig=[Math.round(tp*30)];let active=0;
  BEATS.forEach((b,i)=>{
    if(b.kind==='diagram'){
      const el=document.getElementById('diagram');
      const p=Math.min(1,Math.max(0,(t-b.start)/b.rise));
      el.style.visibility=p>0?'visible':'hidden';
      el.style.clipPath=p>=1?'none':`inset(-6% ${(1-p)*100}% -6% 0)`;
      el.style.opacity=p>=1?1:.15+.85*p;
      sig.push(Math.round(p*36));if(p>0&&p<1)active++;
      return;
    }
    const el=document.getElementById('flow').querySelector(`.beat[data-i="${i}"]`);
    if(!el)return;
    const p=Math.min(1,Math.max(0,(t-b.start)/b.rise));
    if(b.kind==='chip')el.classList.toggle('on',p>=1);
    applyP(el,p);sig.push(Math.round(p*36));if(p>0&&p<1)active++;
  });
  const ab=BEATS.find(b=>b.kind==='aside');
  if(ab){
    const ae=document.getElementById('aside');
    const pa=Math.min(1,Math.max(0,(t-ab.start)/Math.max(.4,ab.rise)));
    ae.style.visibility=pa>0?'visible':'hidden';
    ae.style.opacity=pa>=1?1:.1+.9*pa;
    ae.style.transform=`translateY(${(1-pa)*6}px)`;
    sig.push(Math.round(pa*30));if(pa>0&&pa<1)active++;
  }
  if(SCENE.diagram2){
    const p2=Math.min(1,Math.max(0,(t-SCENE.diagram2)/0.7));
    document.querySelectorAll('#diagram .jval').forEach(g=>{g.setAttribute('opacity',p2);g.style.transition='none'});
    sig.push(Math.round(p2*24)); if(p2>0&&p2<1) active++;
  }
  sig.push(active);
  return sig.join(',');
};
